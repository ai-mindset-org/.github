name: Shared public repository links
on:
  workflow_call:
permissions:
  contents: read
jobs:
  check:
    if: github.repository_owner == 'ai-mindset-org'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read repository under review as data
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          path: subject
          persist-credentials: false
      - name: Read immutable shared policy
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: ai-mindset-org/.github
          ref: 68c820df4be11f129112bf9145d190ca09f9e29f
          path: policy
          persist-credentials: false
      - name: Check tracked documentation and standard labs block
        env:
          REPO_SLUG: ${{ github.event.repository.name }}
        run: python3 policy/tools/public_links.py --repo subject --slug "$REPO_SLUG" --json
      - name: Check live About fields and short-link targets
        if: always()
        env:
          REPO_SLUG: ${{ github.event.repository.name }}
          GH_TOKEN: ${{ github.token }}
        run: python3 policy/tools/public_metadata.py --repo subject --slug "$REPO_SLUG" --json
